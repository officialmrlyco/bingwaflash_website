<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingwa Flash Agent Order Page</title>
<meta name="description" content="Open a Bingwa Flash agent order link to view the business name, agent name, active offers, and payment mode.">
<meta property="og:site_name" content="Bingwa Flash">
<meta property="og:type" content="website">
<meta property="og:title" content="Bingwa Flash Agent Order Page">
<meta property="og:description" content="View an agent's business name, agent name, active offers, and payment mode before ordering with M-Pesa STK push.">
<meta property="og:url" content="https://bingwaflash.co.ke/">
<meta property="og:image" content="https://bingwaflash.co.ke/logo.png">
<meta property="og:image:alt" content="Bingwa Flash logo">
<link rel="stylesheet" href="/site-theme.css?v=20260830-2">
<script src="/site-theme.js?v=20260830" defer></script>
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Bingwa Flash Agent Order Page">
<meta name="twitter:description" content="View an agent's business name, agent name, active offers, and payment mode before ordering with M-Pesa STK push.">
<meta name="twitter:image" content="https://bingwaflash.co.ke/logo.png">
<script>
const segs=window.location.pathname.split('/').filter(Boolean);
const first=(segs[0]||'').toLowerCase();
const second=(segs[1]||'').toLowerCase();

if(!first){
  window.location.replace('/');
}else if(first==='download'||first==='downloads'){
  // Keep old download paths quiet on the main site; the real installer lives on the separate noindex subdomain.
  window.location.replace('/download/');
}else if(first==='privacy'){
  window.location.replace('/privacy.html');
}else if(first==='auth'){
  window.location.replace('/auth.html');
}else if(first==='features'){
  window.location.replace('/#features');
}else if(first==='clients'){
  // /clients/agentusername -> /clients/?u=agentusername
  // /clients/ alone -> just load the page with no agent selected
  if(second&&/^[a-z0-9_]{2,32}$/.test(second)){
    window.location.replace('/clients/?u='+encodeURIComponent(second));
  }else{
    window.location.replace('/clients/');
  }
}else if(!/^(order|contact|404)$/.test(first)&&/^[a-z0-9_]{2,32}$/.test(first)){
  // Static-host fallback for browsers. True per-agent share cards must route this path to the agentPreview function.
  window.location.replace('/order/?u='+encodeURIComponent(first));
}else{
  window.location.replace('/');
}
</script>
</head>
<body>
<button class="page-theme" type="button" data-theme-toggle aria-label="Switch to light mode" title="Switch to light mode">
  <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42-1.42"/></svg>
</button>
<noscript>Open this Bingwa Flash agent order link to view active offers and payment details.</noscript>
</body>
</html>
